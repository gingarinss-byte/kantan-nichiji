<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#267acb"><title>かんたん日時計算</title><style>body{font-family:system-ui,sans-serif;background:#f1f6fc;color:#17263b;margin:0;padding:20px}main{max-width:520px;margin:auto}h1{text-align:center;font-size:26px}section{background:white;border-radius:18px;padding:22px;margin:20px 0;box-shadow:0 3px 12px #cdd8e655}label{font-size:22px;font-weight:700}input{font-size:28px;width:145px;padding:10px;border:2px solid #a8bfd9;border-radius:12px}button{border:0;border-radius:12px;background:#e0efff;padding:12px 15px;margin:5px 3px;font-size:17px}button:active{background:#a8d0ff}.result{background:#e9f6f0;border-radius:14px;text-align:center;padding:18px;margin-top:16px;font-size:30px;font-weight:750}.small{font-size:15px;color:#536479;text-align:center}.refresh{background:#267acb;color:white;display:block;margin:12px auto}</style></head><body><main><h1>🕒 かんたん日時計算</h1><p class="small" id="now"></p><button class="refresh" onclick="update()">🔄 今の時刻で計算</button><section><label for="minutes">⏰ あと何分後？</label><p><input id="minutes" type="number" value="30" min="0" inputmode="numeric"> 分後</p><div id="minbuttons"></div><div class="result" id="timeResult"></div></section><section><label for="days">📅 あと何日後？</label><p><input id="days" type="number" value="7" min="0" inputmode="numeric"> 日後</p><div id="daybuttons"></div><div class="result" id="dateResult"></div></section><p class="small">日本時間で計算します。日付をまたぐ場合も対応しています。</p></main><script>let base=new Date();const $=id=>document.getElementById(id);function jp(d,opts){return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',...opts}).format(d)}function update(){base=new Date();calc()}function calc(){let m=Number($('minutes').value)||0,days=Number($('days').value)||0;let t=new Date(base.getTime()+m*60000);let j=jp(base,{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});$('now').textContent='計算の基準：'+j;$('timeResult').textContent=jp(t,{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});let parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(base);let get=k=>Number(parts.find(p=>p.type===k).value);let d=new Date(Date.UTC(get('year'),get('month')-1,get('day')+days,12));$('dateResult').textContent=jp(d,{year:'numeric',month:'long',day:'numeric',weekday:'long'});}for(let [id,values,input] of [['minbuttons',[5,10,30,60,120],'minutes'],['daybuttons',[1,3,7,14,30],'days']]){values.forEach(v=>{let b=document.createElement('button');b.textContent=v+(input==='minutes'?'分':'日');b.onclick=()=>{$(input).value=v;update()};$(id).appendChild(b)})}['minutes','days'].forEach(id=>$(id).addEventListener('input',calc));calc();</script></body></html>
